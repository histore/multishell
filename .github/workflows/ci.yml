name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gates:
    name: Zero-Token Quality Gates
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run Unified Quality Gates
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./_agents/scripts/run-all-gates.ps1 -Fast

  build-and-test:
    name: Build & Test (.NET 10 on Windows)
    runs-on: windows-latest
    needs: [quality-gates]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore MultiShell.slnx

      - name: Audit NuGet Package Vulnerabilities (CVE Check)
        shell: pwsh
        run: dotnet list MultiShell.slnx package --vulnerable --include-transitive

      - name: Build Solution
        run: dotnet build MultiShell.slnx --configuration Release --no-restore

      - name: Run Automated Tests
        run: dotnet test MultiShell.Tests/MultiShell.Tests.csproj --configuration Release --no-build --verbosity normal

